<svg version="1.1" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 15 376 47">
<!--
  The wordmark, `CHRYSALIS`.

  This file carried the **other product's** name for the whole life of the fork —
  five letters, from the initial commit, redrawn by nobody when the product was
  renamed, because an image keeps its own text. It now says what the product is
  called, in the face, weight and spacing the original was drawn in.

  Kept exactly, measured off the file it replaces:

    * the live band. Cap top at y = 16, baseline at y = 61, and a `viewBox` 27
      units tall — the original's own numbers. The sidebar still renders the
      wordmark in a 27 px box; nothing about the layout moved.
    * the weight: a stem of ~8.6 units at a 45-unit cap, which is what lets a
      27 px wordmark sit beside a 36 px glyph instead of thinning to a hairline.
    * the tracking, ~6.5 units cap-to-cap, and the `L`'s block arm, so an
      uppercase `L` can never read as a lowercase `l` at 16 px.

  What changed is the word, so the box is wider. Nothing else moved.

  **The box is the ink box, and it was not.** The viewBox read `0 0 376 27`
  while the outlines run from `y = 15.01` (cap top, includes the `L`'s overshoot
  above `16`) to `y = 61.68` (baseline plus the round overshoot below `61`) —
  46.67 units of drawing shown through a 27-unit window. `preserveAspectRatio`
  centres content in its box, so the whole word sat *above* centre and the
  sidebar's 27 px slot then swallowed the overhang. Two marks were meant to sit
  on one cap line and neither was on the line it was drawn for.

  The viewBox is now the ink box, `0 15 376 47`: 47 units tall to hold 46.67 of
  ink with a hair of floor under the baseline, and 376 wide to keep the `L`'s
  block arm clear of the edge. Nothing was redrawn — the path data is unchanged,
  so the letterforms are the ones that were measured. A box that is its own ink
  is the one arrangement where `preserveAspectRatio` has nothing to move and the
  wordmark's cap line is a number the sidebar can align to.

  **No `width`/`height` attributes, deliberately.** There used to be a pair
  reading `376`/`27` — the second wrong for the same reason the viewBox was, and
  the first a fixed width the sidebar's 159 px slot did not always have. A
  presentational attribute is outranked by CSS but is still an *intrinsic* size
  an SVG will not shrink below, so stating one here meant the mark either
  overflowed a narrow sidebar or was cropped by it. The viewBox is the only
  geometry this file gives, and `layout.scss` supplies the rest.

  The letters are **outlines, not a font**, set in a face the app already renders
  with: `_theme.tsx`'s stack falls through to `Arial`, and Liberation Sans is its
  metric-compatible equivalent (SIL OFL 1.1, drawn on Arial's advance widths). So
  this is the product's own type baked to geometry — which keeps the sidebar from
  re-typing the name in JSX whenever it is edited, and keeps a 200 KB font out of
  the bundle.

  Colour is inherited, never stated. The paths carry no fill of their own; the
  single `currentColor` rule below paints them, and `layout-sidebar.tsx` sets
  that from `theme.palette.primary.main`. One asset, one appearance, and no
  literal — `/COLOURS.md` §8.
-->
<style>.wm{fill:currentColor;fill-rule:nonzero;}</style>
