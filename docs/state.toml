# docs/state.toml — the single machine-readable home for derived facts.
#
# WHY THIS IS A DATA FILE AND NOT PROSE
#
# Every value below is derivable from this checkout by running something. That
# makes it a CLASS B claim (see docs/operate/CLAIMS.md §2), and Class B claims do
# not belong in a sentence: a sentence cannot be recomputed, so it drifts in
# silence. This file CAN be recomputed, so `server/scripts/check-consistency.sh`
# §9 does exactly that and fails the build when a value here stops agreeing with
# the tree.
#
# There are no bare `source`/`provenance` keys in this file, for a reason that
# bit us immediately: TOML does not allow a key to appear twice in one table, so
# one shared `source` line silently overwrote the previous fact's. The metadata
# is therefore carried in per-fact subtables, keyed by the fact's own name.
#
# RULES
#
#   * Every fact is a subtable with its own `value` and `source`.
#   * `provenance` is one of:
#       "derived"    — recomputable from the tree; §9 enforces value == reality.
#       "asserted"   — true by decision, not derivable (a naming choice, a
#                      policy). §9 only reports it.
#       "unverified" — a world claim we could not check. These are NEVER facts
#                      about the code; see CLAIMS.md §5.
#
# DO NOT ADD A VOLATILE VALUE HERE AND CALL IT DERIVED.
# An IP address is not derivable — the box moves. It is a world claim, and its
# home is docs/operate/CLAIMS.md §5. That confusion is the whole reason this
# file exists; see CLAIMS.md §1.
#
# Added 2026-09-29.

[client.version]
value      = "3.2.28"
source     = "client/package.json, client/src-tauri/Cargo.toml, client/src-tauri/tauri.conf.json"
provenance = "derived"

[client.version_sites]
# Every file `pnpm release-version` rewrites — the FIVE sites a release must keep
# in agreement. This is here so no document has to restate the count: four
# documents ("three version sites", "five version sites", "ALL FIVE version
# sites") drifted against each other, and one of them contradicted the others in
# prose. A count in a sentence is a Class B fact and cannot be recomputed; this
# list can, and §17 recomputes it.
#
# WHY FIVE AND NOT THREE. Three sites must agree at RUNTIME and are guarded by
# `client/src-tauri/tests/version_consistency.rs` (Cargo.toml, package.json,
# tauri.conf.json). The bump script additionally writes Cargo.lock (guarded by
# `cargo fetch --locked` in CI) and this file's `[client.version]` (guarded by §7
# and §9). Both statements are true of different sets; the list below is the
# union, i.e. what a bump must touch.
#
# §17 asserts this list equals the sites it finds in release-version.mjs, so a
# sixth site added to the script — and not here, and not in the prose that links
# here — fails the build. The order is the checker's (sorted), not the script's,
# so a harmless reorder of the updater calls cannot fail the build.
value      = ["client/Cargo.lock", "client/package.json", "client/src-tauri/Cargo.toml", "client/src-tauri/tauri.conf.json", "docs/state.toml"]
source     = "client/scripts/release-version.mjs (the five update*Version() calls)"
provenance = "derived"

[client.first_shipped]
value      = "3.0.0"
source     = "docs/reference/FIXES.md (release history)"
provenance = "asserted"

[client.fork_base]
value      = "Clash Verge Rev v2.5.5 (22e3f1ac)"
source     = "client/docs/UPSTREAM-CHANGES.md"
provenance = "asserted"

[client.engine]
value      = "mihomo (bundled as verge-mihomo)"
source     = "client/docs/UPSTREAM-CHANGES.md"
provenance = "asserted"

[licence.root]
# The project-wide licence for original material: hub, docs, tooling.
value      = "CC-BY-NC-ND-4.0"
source     = "LICENSE (the \u201cExcept where otherwise noted\u201d clause)"
provenance = "asserted"

[licence.client]
# NOT the root licence, and it cannot be: client/ is a fork of Clash Verge Rev
# (GPL-3.0-only) and a GPL fork cannot be relicensed. The root LICENSE carves
# client/ out in its scope table, and that row is the authority — this value is
# checked against it, not against a preferred outcome. Recomputed by
# check-consistency.sh §11 from the LICENSE table + both client manifests, so a
# change to any of the three that disagrees fails the build.
value      = "GPL-3.0-only"
source     = "LICENSE (scope table, `client/` row); client/package.json; client/src-tauri/Cargo.toml; client/LICENSE"
provenance = "derived"

[hub.domain]
# THE ONLY STABLE IDENTIFIER FOR THE DEPLOYED SYSTEM IS THE DOMAIN.
# There is deliberately no host/IP fact anywhere in this file. An address that
# changes on every redeploy is not a derived fact; it is a world claim, and it
# belongs in CLAIMS.md §5 where it can be dated and re-verified. It was recorded
# in STATE.md for months, went stale three times, and finished by naming an
# address that no longer existed — while being labelled "authoritative".
value      = "networkingguides.duckdns.org"
source     = "server/setup.sh (DOMAIN, required env)"
provenance = "derived"

[hub.api_base]
value      = "https://networkingguides.duckdns.org"
source     = "server/scripts/publish-release.sh (PB_API default)"
provenance = "derived"

[hub.console_path]
value      = "/admin/"
source     = "server/setup.sh (log line: 'Admin console: https://${DOMAIN}/admin/')"
provenance = "derived"

[hub.pocketbase_ui]
value      = "/_/"
source     = "server/setup.sh (log line: 'PocketBase UI: https://${DOMAIN}/_/')"
provenance = "derived"

[site.domain]
# The PUBLIC landing page, a second hostname on the SAME box as the hub.
#
# It is deliberately not the hub's hostname and must never become it. The hub
# serves /updates/ (every published build), /api/* and /admin/; the landing page
# is the one hostname here that is INDEXED. Serving them from one name would
# publish the build tree and the API surface on a page whose whole purpose is to
# be crawled. modules/05-caddy.sh generates a separate site block for it, and the
# landing block contains no `handle` at all.
#
# The hub keeps its own name because that name is baked into every deployed
# client (the activation response hands out `server`, the updater resolves
# `update_url`) — renaming it would strand the fleet.
value      = "locusvpn.jadedns.uk"
source     = "server/modules/05-caddy.sh (LANDING_DOMAIN default)"
provenance = "derived"

[site.document_root]
value      = "/var/www/site/"
source     = "server/modules/05-caddy.sh (deploy_site target)"
provenance = "derived"

[site.download_path]
# Where the four download buttons point. The hub's own release path — chosen
# because GitHub will only serve an asset from a URL on the repository
# (/releases/download/<tag>/<file>), so a link to a GitHub asset lands the
# visitor on the repo's download page, which is what the page must not do.
#
# `%s` is the version, from the release manifest. The page is NOT linked to
# "latest": the version is rendered at deploy time from manifest.json, because a
# button pointing at a version the hub does not serve 404s silently.
value      = "https://networkingguides.duckdns.org/updates/<version>/<file>"
source     = "server/scripts/deploy-site.sh; server/scripts/publish-release.sh (PLATFORMS)"
provenance = "derived"

[hub.deploy_staging]
value      = "/root/server/"
source     = "server/setup.sh; server/scripts/hooks-sync.sh"
provenance = "asserted"

[hub.deployed_os]
# A property of the box that is there now, not of this tree. Recorded so a
# reader knows what was being aimed at; verify before trusting.
value      = "Ubuntu 22.04.5, 1 vCPU / 454 MB RAM + 1 GB swap"
source     = "operator observation"
provenance = "unverified"

[client.theme_ids]
# The named themes the client ships, in dropdown order.
#
# This is a fact of the same class as `client.version`: recomputable from the
# tree, so it does not belong in a sentence. The registry
# (`client/src/pages/_themes.ts`) is the authority; check-consistency.sh §9
# recomputes this list from it and fails when the two disagree, so a theme cannot
# be added in one place. See docs/reference/THEMES.md §6.
#
# Note the ordering is part of the value: it is the order the dropdown renders,
# and the first entry is what the control shows when nothing is stored.
value      = ["default-dark", "default-light", "slate", "dawn", "ember", "moss", "linen", "sepia", "contrast"]
source     = "client/src/pages/_themes.ts (the THEMES registry)"
provenance = "derived"

[platforms.keys]
# The four update platforms. The keys say macos_*, the artifact filenames say
# darwin-* — that asymmetry is frozen; see client/src-tauri/src/locus/contract.rs.
# Enforced by check-consistency.sh §1.
value      = ["linux", "windows", "macos_intel", "macos_arm"]
source     = "client/src-tauri/src/locus/contract.rs; server/pb_hooks/*.pb.js"
provenance = "derived"

[tiers.free]
# The free tier's endpoint, recomputable from the tree — a CLASS B fact, so it
# does not belong in a sentence in docs/business/04-tiers.md.
#
# `free` and `eco` are the SAME endpoint: port 8443, the Eco password, the
# `shadowsocks-eco.service` unit. Both tier_configs rows are seeded on purpose —
# `free` for codes minted now, `eco` so codes already in the field keep
# resolving. The customer-facing name is Free; the on-box name stays eco. See
# docs/business/04-tiers.md §4.5.
#
# check-consistency.sh §23 recomputes the cap and the port from 04-tc.sh and
# compares them here, and separately asserts the seed rows and the heartbeat key
# agree — the whole point is that four files describe one endpoint, and the
# AGREEMENT is what must be pinned, not any single file.
#
# The allowance is NOT a fact here: it lives in heartbeat.pb.js so the operator
# can change it without a release, and pinning it in this file would make a
# deliberate, runtime-changeable value look like a build constant.
value      = { port = 8443, cap = "1mbit", tier_rows = ["eco", "free"] }
source     = "server/modules/04-tc.sh; server/scripts/seed-pb.py"
provenance = "derived"

[tiers.paid]
# The paid tier's endpoint, recomputable from the same three files.
#
# THERE IS ONE PAID TIER. Stealth (port 8444) was retired when the paid ladder
# was merged into one plan: Stealth and Strike were the same tier at two rates,
# and the only real difference was Strike's UDP-over-TCP endpoint. Retiring it
# also retired the faster class the second paid tier existed to advertise; the
# paid cap is now 100 Mbps, which is the rate Stealth already sold at and far
# above what any game needs. See docs/business/04-tiers.md §4.2.4.
#
# The retired rate is deliberately NOT written down here, even as history. A
# number in a comment is a number the next person copies back into the code —
# which is exactly why check-consistency.sh §27(c) fails the build on it in
# 04-tc.sh. (A ratified `provenance = "derived"` value is the only number this
# file may state.)
#
# `strike` is the FROZEN row name, for the same reason `eco` is: a code in the
# field carries that string in its `tier` field, and activation/heartbeat resolve
# a tier by looking that string up in `tier_configs`. The customer-facing name is
# "Full"; renaming the row would strand every paid code in the field. See
# docs/business/04-tiers.md §4.6.
#
# check-consistency.sh §27 recomputes the cap and the port from 04-tc.sh, asserts
# the seed row and its udp_relay gating, asserts the retired tier is NOT seeded,
# and asserts the console's placeholder names this row — the AGREEMENT across
# four files, not any single file.
#
# The `udp_relay`/`uot_port` split is NOT a fact here: like the free allowance it
# is set at deploy time (ENABLE_UOT / UOT_PORT) so the operator can move the UoT
# endpoint without a release.
value      = { port = 8445, cap = "100mbit", tier_rows = ["strike"], retired_rows = ["stealth"] }
source     = "server/modules/04-tc.sh; server/scripts/seed-pb.py"
provenance = "derived"

[world]
# A pointer into CLAIMS.md §5, not a fact. Listed here so a reader of this file
# is sent to the right place rather than tempted to put a world claim in this
# table. It has no `value` on purpose: its value is a date and a method, and
# writing an unverified value here would recreate exactly the bug this file was
# built to remove.
register   = "docs/operate/CLAIMS.md"
provenance = "unverified"
